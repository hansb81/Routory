<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Routory · 네이버 로그인</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111827;
      text-align: center;
      word-break: keep-all;
    }
    .box { max-width: 360px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #6b7280; margin: 0 0 16px; }
    a { color: #3b82f6; font-size: 14px; }
  </style>
  <!-- 이 페이지는 SPA(index.html) 밖의 독립된 정적 페이지라 window.TripLog.supabase를 쓸 수 없다 —
       supabase-js를 따로 불러와서 이 파일 안에서만 쓰는 클라이언트를 새로 만든다. index.html과 같은 CDN·버전. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
</head>
<body>
  <div class="box">
    <h1 id="status-title">네이버 로그인 처리 중이에요…</h1>
    <p id="status-note">잠시만 기다려주세요.</p>
    <a href="/#/login">로그인 화면으로 돌아가기</a>
  </div>
  <!-- 콜백 처리 로직은 naver-callback.js로 분리돼 있다(Vercel CSP의 script-src에 'unsafe-inline'을 안
       열기 위해 — 2026-10-19 보안 점검 DEP-01). 전체 흐름 설명은 그 파일 맨 위 주석 참고. -->
  <script src="naver-callback.js"></script>
</body>
</html>
